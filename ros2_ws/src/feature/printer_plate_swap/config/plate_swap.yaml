# =============================================================================
# 3D 프린터 빌드 플레이트 교체 설정
#
# 좌표계: 로봇 베이스 좌표계, 단위 mm / deg
#   작업 좌표 = [x, y, z, rx, ry, rz]   (자세 0,180,0 = 그리퍼가 바닥을 향함)
#   관절 좌표 = [j1, j2, j3, j4, j5, j6]
#
# !!! 아래 poses / racks 좌표는 임시 값입니다 !!!
# 실제 셀 배치에서 `ros2 run printer_plate_swap print_pose` 로
# 로봇을 직접 교시(Direct Teaching)한 위치를 읽어 그대로 붙여 넣으세요.
# =============================================================================

robot:
  id: dsr01
  model: m0609

motion:
  velocity_scale: 0.3      # 0 초과 ~ 1 이하. 첫 시운전은 0.2~0.3 권장
  joint_vel: 40.0          # deg/s     (movej)
  joint_acc: 40.0          # deg/s^2
  travel_vel: [150.0, 40.0]  # [mm/s, deg/s]  공중 이동
  travel_acc: [300.0, 80.0]
  fine_vel: [30.0, 20.0]     # 프린터 내부·랙 근처 정밀 이동
  fine_acc: [60.0, 40.0]
  approach_dz: 80.0        # 파지/놓기 지점 위 접근 높이 (mm)
  peel_dz: 15.0            # 자석 플레이트를 베드에서 떼어낼 때 들어올리는 높이 (mm)
  settle_sec: 0.3          # 파지 직전 정지 안정화 시간 (s)

# 이 범위를 벗어나는 좌표가 하나라도 있으면 노드가 시작되지 않는다
workspace:
  x: [-700.0, 750.0]
  y: [-750.0, 750.0]
  z: [50.0, 700.0]
  max_reach: 850.0         # M0609 공칭 900mm - 여유 50mm
  base_height: 135.0

gripper:
  # mock           : 실제 그리퍼 없이 테스트 (항상 파지 성공)
  # onrobot_modbus : OnRobot Compute Box에 Modbus TCP로 직접 제어 (파지 감지 가능)
  # dsr_io         : 로봇 컨트롤러 디지털 출력으로 제어 (파지 감지 불가)
  backend: mock
  ip: 192.168.1.1
  port: 502
  open_width: 60.0         # mm   (RG2 최대 110mm)
  grip_width: 0.0          # mm   목표 폭 (물체에 닿으면 force 로 정지)
  force: 20.0              # N    (RG2 최대 40N)
  timeout_sec: 5.0
  dsr_io:                  # backend: dsr_io 일 때만 사용
    grip:    {1: 1, 2: 0}  # {출력 번호: 0/1}
    release: {1: 0, 2: 1}
    settle_sec: 1.0

poses:
  home_j: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]

  # 프린터 문 바깥 안전 위치. 프린터 출입은 항상 여기를 거친다
  printer_front: [350.0, 0.0, 350.0, 0.0, 180.0, 0.0]
  # 베드 위 플레이트 손잡이(탭)를 잡는 위치 = 새 플레이트를 내려놓는 위치
  plate_grip:    [560.0, 0.0, 180.0, 0.0, 180.0, 0.0]
  # 플레이트를 들어 앞으로 빼낸 위치 (프린터 프레임 바깥)
  plate_out:     [400.0, 0.0, 195.0, 0.0, 180.0, 0.0]

racks:
  # 사용한(출력 완료) 플레이트를 놓는 슬롯. 위에서 순서대로 사용
  done:
    - [250.0, -400.0, 150.0, 0.0, 180.0, 0.0]
    - [250.0, -480.0, 150.0, 0.0, 180.0, 0.0]
  # 새 플레이트를 가져오는 슬롯
  fresh:
    - [450.0, -400.0, 150.0, 0.0, 180.0, 0.0]
    - [450.0, -480.0, 150.0, 0.0, 180.0, 0.0]
